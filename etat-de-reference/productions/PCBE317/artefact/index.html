<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Modifier ou résilier mon contrat – Mutuelle des Trois Rivières</title>
<meta name="description" content="Maquette interactive du parcours en ligne pour changer de formule ou résilier son contrat santé, avec tous ses états.">
<style>
:root{
  --ink:#14232b; --muted:#4c5c65; --line:#d3dde1; --line-strong:#9fb0b7;
  --bg:#f3f6f5; --surface:#ffffff; --soft:#eaf3f4;
  --brand:#0a5566; --brand-dark:#073f4c; --brand-tint:#d9edf0;
  --focus:#ffbf47;
  --error:#b42318; --error-bg:#fdeceb;
  --ok:#17663a; --ok-bg:#e5f3ea;
  --warn:#7a4a00; --warn-bg:#fff4dc; --warn-line:#e7c27a;
  --radius:12px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--font)}
a{color:var(--brand)}
a:hover{color:var(--brand-dark)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;box-shadow:0 0 0 5px var(--ink)}
[tabindex="-1"]:focus,[tabindex="-1"]:focus-visible{outline:none;box-shadow:none}
h1,h2,h3{line-height:1.25;margin:0}
h1{font-size:1.75rem;letter-spacing:-.01em}
h2{font-size:1.25rem}
h3{font-size:1.05rem}
p{margin:0 0 .8em}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}

/* ---------- Barre de revue (hors maquette) ---------- */
.review{background:#1d252a;color:#e8eef0;font-size:14px}
.review__in{max-width:1160px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.review strong{color:#fff;font-weight:600}
.review label{display:flex;gap:8px;align-items:center}
.review select{font:inherit;padding:6px 8px;border-radius:6px;border:1px solid #56656c;background:#2b353b;color:#fff;max-width:100%}
.review a,.review button{color:#bfe6ec;font:inherit;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline}
.review__tag{background:#ffbf47;color:#1d252a;font-weight:700;border-radius:4px;padding:1px 7px;font-size:12px;letter-spacing:.04em;text-transform:uppercase}
.review__note{color:#a9b7bd}
.review__spacer{flex:1}
body.embed .review{display:none}

/* ---------- En-tête espace adhérent ---------- */
.site-header{background:var(--surface);border-bottom:1px solid var(--line)}
.site-header__in{max-width:1160px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink)}
.brand svg{flex:none}
.brand__name{font-weight:700;font-size:1.02rem;line-height:1.15}
.brand__sub{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.user{margin-left:auto;display:flex;align-items:center;gap:10px;font-size:.92rem}
.user__avatar{width:36px;height:36px;border-radius:50%;background:var(--brand-tint);color:var(--brand-dark);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.user__id{color:var(--muted);font-size:.8rem;display:block}
.subnav{max-width:1160px;margin:0 auto;padding:0 16px;display:flex;gap:4px;overflow-x:auto}
.subnav span{padding:10px 12px;font-size:.92rem;color:var(--muted);white-space:nowrap;border-bottom:3px solid transparent}
.subnav span[aria-current]{color:var(--ink);font-weight:600;border-color:var(--brand)}

/* ---------- Structure ---------- */
main{display:block}
.wrap{max-width:1000px;margin:0 auto;padding:24px 16px 56px}
.wrap--flow{max-width:760px}
.crumbs{font-size:.9rem;color:var(--muted);margin-bottom:16px}
.crumbs ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:4px}
.crumbs li+li::before{content:"›";margin:0 6px 0 2px;color:var(--line-strong)}
.flowbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;font-size:.95rem}
.lead{font-size:1.08rem;color:var(--muted);margin-top:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px}
.card + .card{margin-top:16px}
.grid2 > .card{margin-top:0}
.stack > * + *{margin-top:20px}
.section-title{margin:32px 0 12px}

/* Étapes */
.steps{margin:0 0 20px}
.steps__label{font-size:.92rem;color:var(--muted);margin:0 0 8px}
.steps__label b{color:var(--ink)}
.steps ol{list-style:none;margin:0;padding:0;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.steps li{height:6px;border-radius:3px;background:var(--line)}
.steps li.done,.steps li[aria-current]{background:var(--brand)}

/* Listes de définitions */
.facts{margin:0;display:grid;grid-template-columns:minmax(150px,34%) 1fr;border-top:1px solid var(--line)}
.facts dt,.facts dd{margin:0;padding:12px 0;border-bottom:1px solid var(--line)}
.facts dt{color:var(--muted);padding-right:16px}
.facts dd{font-weight:500}
.facts dd small{display:block;font-weight:400;color:var(--muted);font-size:.9rem;margin-top:2px}
.facts .act{float:right;margin-left:12px;font-weight:400;font-size:.95rem}
.big{font-size:1.15rem;font-weight:700}

/* Boutons */
.actions{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:24px}
.btn{appearance:none;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:10px 22px;border-radius:8px;border:2px solid var(--brand);background:var(--brand);color:#fff;font:600 1rem/1.2 var(--font);text-decoration:none;cursor:pointer}
.btn:hover{background:var(--brand-dark);border-color:var(--brand-dark);color:#fff}
.btn--secondary{background:var(--surface);color:var(--brand)}
.btn--secondary:hover{background:var(--brand-tint);color:var(--brand-dark)}
.btn[aria-disabled="true"]{opacity:.7;cursor:progress}
.linkbtn{appearance:none;background:none;border:0;padding:0;font:inherit;color:var(--brand);text-decoration:underline;cursor:pointer}
.linkbtn:hover{color:var(--brand-dark)}
.spinner{width:16px;height:16px;border:2px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){.spinner{animation:none}}

/* Encadrés */
.note{border-radius:var(--radius);padding:16px 18px;border:1px solid var(--line);background:var(--soft);display:flex;gap:12px}
.note svg{flex:none;margin-top:2px}
.note > div,.facts dd{min-width:0;overflow-wrap:anywhere}
.note h2,.note h3{font-size:1.02rem;margin-bottom:4px}
.note p:last-child,.note ul:last-child{margin-bottom:0}
.note ul{margin:.3em 0 .6em;padding-left:1.1em}
.note--warn{background:var(--warn-bg);border-color:var(--warn-line)}
.note--error{background:var(--error-bg);border-color:var(--error);border-left-width:5px}
.note--ok{background:var(--ok-bg);border-color:#9ccfae}
.note--plain{background:var(--surface)}

/* Formulaires */
fieldset{border:0;margin:0;padding:0;min-width:0}
legend{font-weight:700;font-size:1.1rem;padding:0;margin-bottom:4px}
.hint{color:var(--muted);font-size:.95rem;margin:0 0 12px}
.choices{display:grid;gap:10px;margin-top:12px}
.choice{position:relative;display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border:2px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer}
.choice:hover{border-color:var(--line-strong)}
.choice:has(input:checked){border-color:var(--brand);background:#f3fafb}
.choice input{width:22px;height:22px;margin:2px 0 0;accent-color:var(--brand);flex:none}
.field{margin-top:12px}
.field label{display:block;font-weight:600;margin-bottom:4px}
.field input[type=email],.field textarea{width:100%;font:inherit;padding:10px 12px;border:2px solid var(--line-strong);border-radius:8px;background:#fff;color:var(--ink)}
.field textarea{min-height:96px;resize:vertical}
.field--error{border-left:4px solid var(--error);padding-left:14px}
.field--error input,.field--error textarea{border-color:var(--error)}
.err{color:var(--error);font-weight:600;margin:0 0 6px;display:flex;gap:6px;align-items:flex-start}
.counter{font-size:.88rem;color:var(--muted);margin-top:4px}
.counter.over{color:var(--error);font-weight:600}
.subfield{margin:4px 0 4px 34px}

.errsum{border:3px solid var(--error);border-radius:var(--radius);padding:16px 18px;background:#fff;margin-bottom:20px}
.errsum h2{font-size:1.1rem;color:var(--error);margin-bottom:6px}
.errsum ul{margin:0;padding-left:1.1em}
.errsum a{color:var(--error);font-weight:600}

/* Comparatif */
.compare{width:100%;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.compare-title{font-size:1.1rem;margin:0 0 10px}
.compare th,.compare td{padding:12px 14px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}
.compare tr:last-child > *{border-bottom:0}
.compare thead th{background:#f7faf9;font-size:.95rem}
.compare thead th small{display:block;font-weight:400;color:var(--muted)}
.compare tbody th{font-weight:500;color:var(--ink);width:34%}
.compare .col-new{background:#f6fbfc}
.badge{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--brand-tint);color:var(--brand-dark);margin-top:4px}
.less{display:block;font-size:.85rem;color:var(--warn);font-weight:600;margin-top:2px}
@media (max-width:620px){
  .compare thead{display:none}
  .compare,.compare tbody{display:block}
  .compare tr{display:grid;grid-template-columns:1fr 1fr;border-bottom:1px solid var(--line)}
  .compare tr:last-child{border-bottom:0}
  .compare tbody th{grid-column:1/-1;width:auto;background:#f7faf9;border-bottom:0;padding-bottom:6px}
  .compare td{border-bottom:0}
  .compare td::before{content:attr(data-col);display:block;font-size:.78rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
}

/* Page contrat */
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.formula{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;align-items:flex-start}
.formula__price{text-align:right}
@media (max-width:560px){.formula__price{text-align:left}}
.formula__name{font-size:1.5rem;font-weight:700}
.price{font-size:1.6rem;font-weight:700}
.price small{font-size:.95rem;font-weight:400;color:var(--muted)}
.list-plain{list-style:none;margin:0;padding:0}
.list-plain li{padding:6px 0}
.garanties{margin:0;padding-left:1.1em}
.garanties li{margin:4px 0}
.option h3{font-size:1.15rem;margin-bottom:6px}
.option p{color:var(--muted)}
.option .btn{margin-top:4px}
.status{display:inline-block;font-size:.82rem;font-weight:700;padding:3px 10px;border-radius:999px}
.status--warn{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn-line)}
.status--info{background:var(--brand-tint);color:var(--brand-dark)}

/* Confirmation */
.success{background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--ok);border-radius:var(--radius);padding:24px}
.success__icon{width:48px;height:48px;border-radius:50%;background:var(--ok-bg);display:grid;place-items:center;margin-bottom:12px}
.next{margin:0;padding-left:1.2em}
.next li{margin:8px 0}

/* Pied de page */
.site-footer{border-top:1px solid var(--line);background:var(--surface);font-size:.92rem;color:var(--muted)}
.site-footer__in{max-width:1160px;margin:0 auto;padding:20px 16px;display:flex;flex-wrap:wrap;gap:8px 24px}
.site-footer strong{color:var(--ink)}

/* ---------- Planche ---------- */
.planche{max-width:1400px;margin:0 auto;padding:24px 16px 64px}
.planche h1{font-size:1.6rem}
.planche > p{max-width:780px;color:var(--muted)}
.planche h2{margin:36px 0 14px;font-size:1.25rem;padding-bottom:6px;border-bottom:2px solid var(--line)}
.board{display:flex;flex-wrap:wrap;gap:28px}
.frame{margin:0;width:392px;max-width:100%}
.frame__screen{width:392px;max-width:100%;height:760px;border:1px solid var(--line-strong);border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 8px 24px rgba(20,35,43,.08)}
.frame iframe{width:390px;height:760px;border:0;display:block}
.frame figcaption{margin-top:10px;font-size:.95rem}
.frame figcaption b{display:block}
.frame figcaption span{color:var(--muted);display:block;font-size:.9rem}
@media (max-width:440px){.frame,.frame__screen{width:100%}.frame iframe{width:100%}}

@media (max-width:560px){
  body{font-size:16px}
  h1{font-size:1.45rem}
  .facts{grid-template-columns:1fr}
  .facts dt{border-bottom:0;padding-bottom:0;font-size:.9rem}
  .facts dd{padding-top:2px}
  .user__txt{display:none}
  .actions .btn{width:100%}
  .card{padding:16px}
  .wrap{padding-top:16px}
}
</style>
</head>
<body>

<div class="review" id="review" role="region" aria-label="Outils de revue de la maquette">
  <div class="review__in">
    <span class="review__tag">Maquette</span>
    <strong>Parcours « Modifier ou résilier mon contrat santé »</strong>
    <label>Aller à l’écran
      <select id="review-select"></select>
    </label>
    <a id="review-planche" href="?vue=planche">Planche de tous les états</a>
    <button type="button" id="review-reset">Recommencer</button>
    <span class="review__spacer"></span>
    <span class="review__note">Scénario : demande faite le mercredi 21 octobre 2026</span>
  </div>
</div>

<div id="app"></div>

<script>
(function(){
'use strict';

/* ================= Données fournies (fictives) ================= */
const D = {
  mutuelle: 'Mutuelle des Trois Rivières',
  tel: '09 00 00 00 00',
  horaires: 'du lundi au vendredi, de 9 h à 18 h',
  mail: 'contact@trois-rivieres.example',
  nom: 'Camille Moreau',
  initiales: 'CM',
  numero: 'TR-204-58817',
  depuis: '1er mars 2024',
  enfant: 'Léo Moreau',
  enfantNe: '2015',
  compte: '4412',
  // Hypothèses de la maquette
  courriel: 'camille.moreau@courriel.example',
  aujourdhui: '21 octobre 2026',
  effetModif: '1er novembre 2026',
  effetResil: '21 novembre 2026',
  moisEnCours: 'octobre 2026',
  moisSuivant: 'novembre 2026',
  anneeSuivante: '1er janvier 2027'
};
const F = {
  confort:     { nom:'Confort',     adulte:'61,90 €', enfant:'19,80 €', total:'81,70 €' },
  essentielle: { nom:'Essentielle', adulte:'38,40 €', enfant:'12,10 €', total:'50,50 €' },
  ecart: '31,20 €'
};
const GARANTIES = [
  { lib:'Consultation chez un généraliste', confort:'150 % de la base de remboursement', ess:'100 % de la base de remboursement' },
  { lib:'Hospitalisation, chambre particulière', confort:'60 € par jour, 30 jours par an', ess:'Non couverte' },
  { lib:'Optique', confort:'250 € par an', ess:'100 € par an' },
  { lib:'Dentaire, prothèses', confort:'250 % de la base', ess:'125 % de la base' },
  { lib:'Médecines douces', confort:'4 séances par an, 30 € chacune', ess:'Non couvertes' }
];
const RAISONS = [
  { v:'prix', lib:'Le prix' },
  { v:'garanties', lib:'Les garanties' },
  { v:'demenagement', lib:'Un déménagement' },
  { v:'autre', lib:'Autre raison' }
];
const AUTRE_MAX = 300;

/* ================= Catalogue des écrans et états ================= */
const ETATS = [
  { id:'contrat', groupe:'Point de départ', titre:'Mon contrat santé', desc:'Adhérent connecté, les deux actions sont visibles à égalité.' },
  { id:'resil-1', groupe:'Résiliation', titre:'Étape 1 · Conditions et date d’effet', desc:'Date d’effet, absence de frais, rappel non bloquant du changement de formule.' },
  { id:'resil-2', groupe:'Résiliation', titre:'Étape 2 · Raison du départ (facultatif)', desc:'Questionnaire facultatif, bouton « Passer cette question ».' },
  { id:'resil-2-autre', groupe:'Résiliation', titre:'Étape 2 · « Autre raison » précisée', desc:'Champ libre facultatif qui apparaît avec « Autre raison ».', preset:{ screen:'resil-2', raison:'autre', autre:'Je pars vivre chez mes parents, qui ont déjà une mutuelle familiale.' } },
  { id:'resil-2-erreur', groupe:'Résiliation', titre:'Étape 2 · Erreur : texte trop long', desc:'Le seul cas bloquant de cette étape : plus de 300 caractères.', preset:{ screen:'resil-2', raison:'autre', autre:'Je trouve que les remboursements ne suivent pas mes besoins actuels. '.repeat(5).trim(), autreErreur:true } },
  { id:'resil-3', groupe:'Résiliation', titre:'Étape 3 · Vérifier, confirmer ou annuler', desc:'Rien n’est envoyé avant « Confirmer la résiliation ».', preset:{ screen:'resil-3', raison:'prix' } },
  { id:'resil-3-erreur', groupe:'Résiliation', titre:'Étape 3 · Erreur de saisie (courriel)', desc:'Adresse modifiée sans « @ » : résumé d’erreur et message sous le champ.', preset:{ screen:'resil-3', raison:'prix', emailOpen:true, emailDraft:'camille.moreau.courriel.example', emailError:'Il manque le signe « @ » dans l’adresse. Exemple : nom@domaine.fr' } },
  { id:'resil-3-envoi', groupe:'Résiliation', titre:'Étape 3 · Erreur : envoi impossible', desc:'Panne technique : rien n’est enregistré, on peut réessayer.', preset:{ screen:'resil-3', raison:'prix', envoiErreur:true } },
  { id:'resil-ok', groupe:'Résiliation', titre:'Confirmation · Demande envoyée', desc:'Date d’effet et accusé de réception par courriel.', preset:{ screen:'resil-ok', raison:'prix', resilEnvoyee:true } },
  { id:'contrat-resil-annulee', groupe:'Résiliation', titre:'Résiliation annulée', desc:'Retour au contrat : aucune demande envoyée.', preset:{ screen:'contrat', banner:'resil-annulee' } },
  { id:'contrat-apres-resil', groupe:'Résiliation', titre:'Mon contrat après l’envoi', desc:'Le contrat affiche la résiliation en cours.', preset:{ screen:'contrat', resilEnvoyee:true } },
  { id:'modif-1', groupe:'Changement de formule', titre:'Étape 1 · Comparer et choisir', desc:'Comparatif Confort / Essentielle pour Camille et Léo, règles de prise d’effet.' },
  { id:'modif-1-bloque', groupe:'Changement de formule', titre:'Étape 1 · Passage déjà utilisé cette année', desc:'Variante : un adhérent qui a déjà quitté Confort pour Essentielle en 2026 (ce n’est pas le cas de Camille Moreau).', preset:{ screen:'modif-1', bloque:true } },
  { id:'modif-2', groupe:'Changement de formule', titre:'Étape 2 · Vérifier, confirmer ou annuler', desc:'Nouvelle cotisation, mois en cours au tarif actuel, règle annuelle.' },
  { id:'modif-2-erreur', groupe:'Changement de formule', titre:'Étape 2 · Erreur de saisie (courriel)', desc:'Adresse incomplète : extension manquante.', preset:{ screen:'modif-2', emailOpen:true, emailDraft:'camille.moreau@courriel', emailError:'L’adresse est incomplète : il manque la fin, par exemple « .fr » ou « .com ». Exemple : nom@domaine.fr' } },
  { id:'modif-ok', groupe:'Changement de formule', titre:'Confirmation · Changement enregistré', desc:'Date d’effet et nouvelle cotisation.', preset:{ screen:'modif-ok', modifEnvoyee:true } },
  { id:'contrat-modif-annulee', groupe:'Changement de formule', titre:'Changement annulé', desc:'Retour au contrat : la formule Confort continue.', preset:{ screen:'contrat', banner:'modif-annulee' } },
  { id:'contrat-apres-modif', groupe:'Changement de formule', titre:'Mon contrat après le changement', desc:'Le changement prévu au 1er novembre est affiché.', preset:{ screen:'contrat', modifEnvoyee:true } }
];
const SCREENS = ['contrat','resil-1','resil-2','resil-3','resil-ok','modif-1','modif-2','modif-ok'];

/* ================= État ================= */
function fresh(){
  return { screen:'contrat', raison:null, autre:'', autreErreur:false,
    email:D.courriel, emailOpen:false, emailDraft:'', emailError:'',
    envoiErreur:false, envoi:false, banner:null, bloque:false,
    resilEnvoyee:false, modifEnvoyee:false };
}
let S = fresh();

/* ================= Outils ================= */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nb = s => s.replace(/ (€|%)/g,' $1');
const ICON = {
  info:'<svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 11v6M12 7.5v.5" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',

function validateEmail(v){
  v = v.trim();
  if(!v) return 'Saisissez l’adresse courriel où recevoir l’accusé de réception. Exemple : nom@domaine.fr';
  if(!v.includes('@')) return 'Il manque le signe « @ » dans l’adresse. Exemple : nom@domaine.fr';
  if(/\s/.test(v)) return 'L’adresse ne doit pas contenir d’espace. Exemple : nom@domaine.fr';
  const parts = v.split('@');
  if(parts.length !== 2 || !parts[0]) return 'Vérifiez le début de l’adresse, avant le « @ ». Exemple : nom@domaine.fr';
  if(!/^[^.]+(\.[^.]+)*\.[a-z]{2,}$/i.test(parts[1])) return 'L’adresse est incomplète : il manque la fin, par exemple « .fr » ou « .com ». Exemple : nom@domaine.fr';
  return '';
}

function crumbs(items){
  return `<nav class="crumbs" aria-label="Fil d’Ariane"><ol>${items.map((t,i)=>`<li${i===items.length-1?' aria-current="page"':''}>${t}</li>`).join('')}</ol></nav>`;
}

function flowbar(backTo, backLabel, quitLabel){
  return `<div class="flowbar">
    <a href="#${backTo}" data-go="${backTo}">${ICON.back} ${backLabel}</a>
    <a href="#contrat" data-go="contrat" data-quit="1">${quitLabel}</a>
  </div>`;
}

function steps(current, total, label){
  let lis = '';
  for(let i=1;i<=total;i++) lis += `<li class="${i<current?'done':''}"${i===current?' aria-current="step"':''}></li>`;
  return `<div class="steps"><p class="steps__label">Étape <b>${current}</b> sur ${total} : ${label}</p><ol aria-hidden="true">${lis}</ol></div>`;
}

function errorSummary(items){
  if(!items.length) return '';
  return `<div class="errsum" role="alert" tabindex="-1" id="errsum">
    <h2>${items.length>1?'Il y a '+items.length+' problèmes':'Il y a un problème'}</h2>
    <ul>${items.map(it=>`<li><a href="#${it.id}" data-focus="${it.id}">${esc(it.msg)}</a></li>`).join('')}</ul>
  </div>`;
}

}

/* ================= Rendu et navigation ================= */
const app = document.getElementById('app');
const TITRES = {
  'contrat':'Mon contrat santé', 'resil-1':'Résilier – étape 1 sur 3', 'resil-2':'Résilier – étape 2 sur 3',
  'resil-3':'Résilier – étape 3 sur 3', 'resil-ok':'Résiliation envoyée', 'modif-1':'Changer de formule – étape 1 sur 2',
  'modif-2':'Changer de formule – étape 2 sur 2', 'modif-ok':'Changement de formule enregistré'
};

function render(focusTarget){
  let title = TITRES[S.screen];
  const hasErr = (S.emailError && S.emailOpen) || (S.autreErreur && S.autre.length > AUTRE_MAX);
  if(hasErr) title = 'Erreur : ' + title;
  document.title = title + ' – ' + D.mutuelle;
  app.innerHTML = R[S.screen]();
  typo(app);
  const sel = document.getElementById('review-select');
  if(sel){ const cur = location.hash.slice(1); if([...sel.options].some(o=>o.value===cur)) sel.value = cur; }
  if(focusTarget === false) return;
  let el = null;
  if(focusTarget) el = document.getElementById(focusTarget);
  if(!el) el = document.getElementById('errsum') || document.getElementById('envoi-err') || document.getElementById('banner') || document.getElementById('bloque') || app.querySelector('h1');
  if(el){ el.focus({preventScroll:true}); }
  window.scrollTo(0,0);
}

// Typographie française : espace insécable avant ? ! ; : » et après «
function typo(root){
  const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  let n; while((n = w.nextNode())){
    const p = n.parentNode && n.parentNode.nodeName;
    if(p==='SCRIPT'||p==='STYLE'||p==='TEXTAREA') continue;
    const t = n.nodeValue.replace(/ ([?!;:»])/g,'\u00a0$1').replace(/« /g,'«\u00a0');
    if(t !== n.nodeValue) n.nodeValue = t;
  }
}

function clearTransient(){
  S.emailError=''; S.envoiErreur=false; S.envoi=false; S.autreErreur=false; S.banner=null;
}

function go(screen){
  clearTransient();
  if(screen !== 'resil-3' && screen !== 'modif-2'){ S.emailOpen=false; }
  S.screen = screen;
  if(location.hash.slice(1) === screen) render();
  else location.hash = screen;
}

let fromReview = false;
function applyRoute(initial){
  const id = location.hash.slice(1) || 'contrat';
  const etat = ETATS.find(e=>e.id===id);
  const isScreen = SCREENS.includes(id);
  if(etat && (fromReview || initial === true || !isScreen)){
    // Accès direct à un état (barre de revue, planche, lien) : on repart d'un état connu
    S = Object.assign(fresh(), etat.preset || {}, {screen:(etat.preset && etat.preset.screen) || id});
  } else if(isScreen){
    if(id !== S.screen) clearTransient();
    S.screen = id;
  } else {
    S = fresh();
  }
  fromReview = false;
  render();
}

function readEmailDraft(){
  const inp = document.getElementById('email');
  if(inp) S.emailDraft = inp.value;
}

function send(kind){
  if(S.emailOpen){
    readEmailDraft();
    const err = validateEmail(S.emailDraft);
    if(err){ S.emailError = err; S.envoiErreur=false; render(); return; }
    S.email = S.emailDraft.trim(); S.emailOpen=false; S.emailError='';
  }
  S.envoiErreur=false; S.envoi=true; render('main');
  const btn = app.querySelector('[aria-disabled="true"]'); if(btn) btn.focus();
  setTimeout(()=>{
    S.envoi=false;
    if(kind==='resil'){ S.resilEnvoyee=true; go('resil-ok'); }
    else { S.modifEnvoyee=true; go('modif-ok'); }
  }, 900);
}

app.addEventListener('click', e=>{
  const a = e.target.closest('[data-go]');
  if(a){
    e.preventDefault();
    const dest = a.getAttribute('data-go');
    if(a.hasAttribute('data-quit')){
      if(S.screen.startsWith('resil') && S.screen!=='resil-ok'){ go('contrat'); S.banner='resil-annulee'; render(); return; }
      if(S.screen.startsWith('modif') && S.screen!=='modif-ok'){ go('contrat'); S.banner='modif-annulee'; render(); return; }
    }
    if(S.screen==='resil-2' && dest==='resil-1') saveRaison();
    go(dest); return;
  }
  const f = e.target.closest('[data-focus]');
  if(f){ e.preventDefault(); const t=document.getElementById(f.getAttribute('data-focus')); if(t){ t.focus(); t.scrollIntoView({block:'center'}); } return; }
  const b = e.target.closest('[data-action]');
  if(!b) return;
  const act = b.getAttribute('data-action');
  switch(act){
    case 'email-open': S.emailOpen=true; S.emailDraft=S.email; S.emailError=''; render('email'); break;
    case 'email-cancel': S.emailOpen=false; S.emailError=''; render('email-display'); break;
    case 'raison-skip': S.raison=null; S.autre=''; go('resil-3'); break;
    case 'resil-send': send('resil'); break;
    case 'modif-send': send('modif'); break;
    case 'resil-cancel': go('contrat'); S.banner='resil-annulee'; S.raison=null; S.autre=''; render(); break;
    case 'modif-cancel': go('contrat'); S.banner='modif-annulee'; render(); break;
  }
});

function saveRaison(){
  const form = document.getElementById('f-raison'); if(!form) return;
  const r = form.querySelector('input[name=raison]:checked'); S.raison = r ? r.value : null;
  const t = document.getElementById('autre'); if(t) S.autre = t.value;
}

app.addEventListener('change', e=>{
  if(e.target.name==='raison'){
    saveRaison(); S.autreErreur=false;
    const v = e.target.value; render(false);
    const r = app.querySelector(`input[name=raison][value="${v}"]`); if(r) r.focus();
  }
});
app.addEventListener('input', e=>{
  if(e.target.id==='autre'){
    S.autre = e.target.value;
    const c = document.getElementById('autre-count');
    if(c){ c.textContent = `${S.autre.length} / ${AUTRE_MAX} caractères`; c.classList.toggle('over', S.autre.length>AUTRE_MAX); }
  }
});
app.addEventListener('submit', e=>{
  if(e.target.id==='f-raison'){
    e.preventDefault(); saveRaison();
    if(S.raison==='autre' && S.autre.length > AUTRE_MAX){ S.autreErreur=true; render(); return; }
    if(S.raison!=='autre') S.autre='';
    go('resil-3');
  }
});

/* ================= Barre de revue ================= */
const params = new URLSearchParams(location.search);
if(params.has('embed')) document.body.classList.add('embed');

const sel = document.getElementById('review-select');
const groupes = [...new Set(ETATS.map(e=>e.groupe))];
sel.innerHTML = groupes.map(g=>`<optgroup label="${g}">${ETATS.filter(e=>e.groupe===g).map(e=>`<option value="${e.id}">${e.titre}</option>`).join('')}</optgroup>`).join('');
sel.addEventListener('change', ()=>{ fromReview = true; if(location.hash.slice(1)===sel.value) applyRoute(); else location.hash = sel.value; });
document.getElementById('review-reset').addEventListener('click', ()=>{ S = fresh(); if(location.hash==='#contrat') render(); else location.hash='contrat'; });

/* ================= Planche de tous les états ================= */
function renderPlanche(){
  document.title = 'Planche des états – Modifier ou résilier – ' + D.mutuelle;
  document.getElementById('review-planche').textContent = 'Prototype interactif';
  document.getElementById('review-planche').setAttribute('href', location.pathname);
  sel.closest('label').style.display='none';
  document.getElementById('review-reset').style.display='none';
  app.innerHTML = `<main class="planche">
    <h1>Planche des écrans et de leurs états</h1>
    <p>Chaque écran est affiché ici en largeur mobile (390 px) ; on peut faire défiler l’intérieur de chaque cadre. Le lien sous chaque cadre ouvre l’état dans le prototype interactif, en pleine largeur.</p>
    ${groupes.map(g=>`<h2>${g}</h2><div class="board">${ETATS.filter(e=>e.groupe===g).map(e=>`
      <figure class="frame">
        <div class="frame__screen"><iframe loading="lazy" title="${esc(e.titre)}" src="?embed=1#${e.id}"></iframe></div>
        <figcaption><b>${e.titre}</b><span>${e.desc}</span><a href="${location.pathname}#${e.id}">Ouvrir dans le prototype</a></figcaption>
      </figure>`).join('')}</div>`).join('')}
  </main>`;
  typo(app);
}

if(params.get('vue')==='planche'){ renderPlanche(); }
else { window.addEventListener('hashchange', ()=>applyRoute(false)); applyRoute(true); }

})();
</script>
