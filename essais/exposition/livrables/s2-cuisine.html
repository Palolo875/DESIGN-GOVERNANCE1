TRACE (légère) — Design Governance V1, mode STANDARD, proposition EXPLORATORY (ni verdict, ni acceptation)
1. Mode : STANDARD (écran nouveau d’un outil interne). Protection de niveau : sécurité alimentaire (DLC) + mains mouillées → pas de micro-delta, états et récupération observés.
2. Thèse : « se voir d’un regard à 1 m, se corriger d’un pouce mouillé » — promesse → objet de preuve (la liste de stock dont seules les exceptions parlent, quantité en très gros, niveau tracé au bas de chaque ligne) → geste (− / + / Retirer / Commander, avec « Annuler » au lieu de confirmations).
3. Modal écarté : tableau de bord SaaS (barre latérale, 4 cartes de chiffres, tableau dense, pastilles vert/orange/rouge, recherche au clavier). Trame : état → exceptions → reste → bon de commande. Parti : le calme = tout va bien ; couleur réservée aux exceptions, jamais seule (texte + icône + épaisseur).
4. Plafond : structure, typographie (Atkinson Hyperlegible Next, OFL, intégrée), couleur (jetons calculés) et interactions codées et observées ; aucun asset figuratif ; contenu = exemples marqués (produits, quantités, seuils, dates relatives à aujourd’hui) ; hors ligne, envoi de commande, ajout de produit, droits et sauvegarde : non construits.
5. Défaut dominant restant : à vérifier sur tablette réelle (reflets, eau, distance de lecture) ; les mesures faites ici sont des mesures de rendu, pas un test d’usage.
6. Prochaine preuve : 10 minutes de passage avec la vraie liste de produits, tablette posée au passe, mains mouillées, par la personne qui compte le stock.

:root{
  --bg:#e7eef0; --surface:#f7fbfc; --inset:#dfe8ea; --line:#b6c0c2; --line-strong:#7a898f;
  --ink:#122028; --ink-2:#3b4a53;
  --act:#004d74; --act-ink:#f9fcfd;
  --urg:#b31319; --urg-ink:#94020d; --urg-tint:#ffe9e5; --urg-bar:#cc2827;
  --att-ink:#683c00; --att-tint:#fff3ce; --att-bar:#b66d00;
  --track:#cdd6d8;
  --target:64px; --gap:8px; --rail:0px; --pad:24px;
  font-family:"Atkinson Hyperlegible Next","Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:18px; line-height:1.3; color:var(--ink); background:var(--bg);
  -webkit-text-size-adjust:100%; text-size-adjust:100%;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);min-height:100vh;font-variant-numeric:tabular-nums;overscroll-behavior-y:contain}
button{font:inherit;color:inherit;margin:0;border:0;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;text-align:center}
button:disabled{cursor:not-allowed}
p,h1,h2,ul{margin:0;padding:0}
ul{list-style:none}
svg.i{width:24px;height:24px;flex:none;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:4px solid var(--act);outline-offset:3px;border-radius:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Châssis ---------- */
.app{display:block}
.main{min-width:0}
@media (min-width:1240px){
  :root{--rail:304px}
  .app{display:grid;grid-template-columns:minmax(0,1fr) var(--rail);align-items:start}
}

.app.bare{display:block}
.app.bare .cmd,.app.bare .seg,.app.bare .btn-cmd{display:none}
/* ---------- Barre ---------- */
.bar{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:2px solid var(--line);
  padding:10px var(--pad);display:grid;grid-template-columns:minmax(0,1fr) auto auto;grid-template-areas:"id seg cmd";align-items:center;gap:10px 20px}
.bar .id{grid-area:id;min-width:0}
.bar .seg{grid-area:seg}
.bar .btn-cmd{grid-area:cmd}
@media (min-width:1240px){.bar{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"id seg"}}
@media (max-width:959px){.bar{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"id cmd" "seg seg"}.bar .seg{justify-self:start}}
.bar h1{font-size:30px;line-height:1.1;font-weight:760;letter-spacing:-.01em}
.bar .when{font-size:18px;color:var(--ink-2);margin-top:2px;white-space:nowrap}
.st{margin-left:auto;display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px 14px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:18px;font-weight:600;color:var(--ink-2);white-space:nowrap}
.sync .i{width:20px;height:20px;stroke-width:3}
.sync.warn{color:var(--att-ink);font-weight:760}
.chip{display:inline-flex;align-items:center;min-height:34px;padding:0 12px;border-radius:10px;font-size:17px;font-weight:650;color:var(--ink-2);border:2px dashed var(--line-strong);white-space:nowrap}
.seg{display:flex;gap:6px;padding:6px;background:var(--inset);border-radius:20px;border:2px solid var(--line)}
.seg button{min-height:calc(var(--target) - 8px);padding:0 18px;border-radius:14px;font-size:20px;font-weight:700;display:flex;align-items:center;gap:10px;color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.seg button:active{background:var(--line)}
.seg button[aria-pressed="true"]:active{background:var(--ink-2)}
.seg .n{min-width:32px;height:32px;padding:0 8px;border-radius:16px;background:var(--urg);color:#fff;font-size:18px;font-weight:760;display:inline-flex;align-items:center;justify-content:center}
.seg .n.zero{display:none}
.btn-cmd{display:none;min-height:var(--target);padding:0 20px;border-radius:16px;background:var(--act);color:var(--act-ink);font-size:20px;font-weight:700;align-items:center;gap:10px}
.btn-cmd .n{min-width:32px;height:32px;padding:0 8px;border-radius:16px;background:var(--surface);color:var(--act);font-weight:760;display:inline-flex;align-items:center;justify-content:center}
@media (max-width:1239px){.btn-cmd{display:inline-flex}}
.btn-cmd:active{background:var(--ink)}

#banner:empty{display:none}
.banner{display:flex;align-items:center;gap:14px;padding:14px var(--pad);background:var(--att-tint);border-bottom:2px solid var(--att-ink);color:var(--att-ink);font-weight:650;font-size:19px}
.banner .i{width:28px;height:28px}
.banner p{flex:1}

/* ---------- Liste ---------- */
.view{padding:18px var(--pad) 140px}
.sec{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;margin:6px 0 12px}
.sec h2{font-size:30px;font-weight:760;line-height:1.1;letter-spacing:-.01em}
.sec .cnt{font-size:30px;font-weight:760;color:var(--urg-ink)}
.sec.rest h2{font-size:24px;color:var(--ink-2);font-weight:700}
.sec.rest .cnt{font-size:24px;color:var(--ink-2)}
.sec + .rows{margin-bottom:26px}
.rows{display:flex;flex-direction:column;gap:6px}

.row{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto 168px;align-items:center;gap:8px 14px;
  background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:6px 12px 12px 24px;overflow:hidden}
.row::before{content:"";position:absolute;left:0;top:0;bottom:0;width:10px;background:transparent}
.row.t2{background:var(--urg-tint);border-color:var(--urg-ink)}
.row.t2::before{background:var(--urg-bar)}
.row.t1{border-color:var(--att-ink)}
.row.t1::before{background:var(--att-bar);width:10px}
.row.done::before{background:var(--line-strong)}
.nm{font-size:28px;line-height:1.1;font-weight:700;letter-spacing:-.005em;overflow-wrap:anywhere}
.nm .z{font-size:18px;font-weight:600;color:var(--ink-2);margin-left:10px;letter-spacing:0;white-space:nowrap}
.view[data-zone="froid"] .z,.view[data-zone="reserve"] .z{display:none}
.row .id{container-type:inline-size}
.z .zs{display:none}
@container (max-width:435px){.z .zf{display:none}.z .zs{display:inline}}
.sub{margin-top:4px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;min-height:34px}
.meta{font-size:18px;color:var(--ink-2);font-weight:500}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px 0 8px;border-radius:8px;border:2px solid;font-size:17px;font-weight:700;line-height:1.1;background:var(--surface)}
.tag .i{width:20px;height:20px;stroke-width:2.8}
.tag.urg{border-color:var(--urg-ink);color:var(--urg-ink)}
.tag.solid{background:var(--urg);border-color:var(--urg);color:#fff}
.tag.att{border-color:var(--att-ink);background:var(--att-tint);color:var(--att-ink)}
.tag.done{border-color:var(--line-strong);background:var(--inset);color:var(--ink)}

.step{display:flex;align-items:center;gap:8px}
.sb{width:var(--target);height:var(--target);border-radius:16px;background:var(--surface);border:2px solid var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;color:var(--ink)}
.sb .i{width:30px;height:30px;stroke-width:3.2}
.sb small{font-size:16px;font-weight:700;line-height:1;margin-top:-1px;color:var(--ink-2)}
.sb:active{background:var(--ink);color:var(--surface)}
.sb:active small{color:var(--surface)}
.sb:disabled{border-style:dashed;border-color:var(--line-strong);color:var(--ink-2);background:transparent;opacity:.75}
.qv{width:148px;height:var(--target);padding:0 8px;white-space:nowrap;border-radius:16px;background:var(--inset);border:2px solid var(--line-strong);display:flex;align-items:baseline;justify-content:center;gap:6px;font-size:40px;font-weight:760;line-height:var(--target);color:var(--ink)}
.qv span{font-size:19px;font-weight:650;color:var(--ink-2)}
.qv:active{background:var(--line)}
.row.t2 .qv{background:var(--surface)}
.act{display:flex;justify-content:flex-end;min-width:0}
.go{height:var(--target);width:100%;border-radius:16px;background:var(--act);color:var(--act-ink);font-size:20px;font-weight:700;padding:0 12px;display:flex;align-items:center;justify-content:center;gap:8px}
.go .i{width:24px;height:24px}
.go:active{background:var(--ink)}
.go[aria-pressed="true"]{background:var(--surface);color:var(--act);border:2px solid var(--act)}
.gauge{position:absolute;left:0;right:0;bottom:0;height:8px;background:var(--track)}
.gauge i{position:absolute;left:0;top:0;bottom:0;background:var(--ink-2)}
.gauge.low i{background:var(--att-bar)}
.gauge b{position:absolute;top:-1px;bottom:-1px;width:4px;background:var(--ink);transform:translateX(-2px)}

/* Grille de rangée, recomposée selon la largeur */
@media (max-width:820px){
  .row{grid-template-columns:minmax(0,1fr) auto}
  .row .id{grid-column:1;grid-row:1}
  .row .act{grid-column:2;grid-row:1}
  .row .act:empty{display:none}
  .row .step{grid-column:1 / -1;grid-row:2;width:100%}
  .go{width:auto}
  .qv{flex:1}
  .sb{flex:none}
}
@media (max-width:520px){
  :root{--pad:16px}
  .bar h1{font-size:26px}
  .bar{grid-template-columns:minmax(0,1fr);grid-template-areas:"id" "seg" "cmd"}
  .bar .seg{justify-self:stretch}
  .seg{width:100%}
  .seg button{flex:1;justify-content:center;padding:0 8px;font-size:18px}
  .nm{font-size:25px}
  .row{padding-left:22px}
  .qv{min-width:0}
}

/* Calme / vide / chargement / erreur */
.calm{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;padding:22px 24px;background:var(--surface);border:2px solid var(--line-strong);border-radius:16px;margin:6px 0 26px}
.calm > .i{width:44px;height:44px;color:var(--ink);flex:none}
.calm .st{align-self:flex-start;flex-direction:column;align-items:flex-end}
@media (max-width:700px){.calm .st{margin-left:0;flex-direction:row;align-items:center;justify-content:flex-start;width:100%}}
.calm h2{font-size:30px;font-weight:760;line-height:1.1}
.calm p{color:var(--ink-2);font-size:19px;margin-top:4px}
.first{max-width:680px;margin:48px auto 0;padding:36px;background:var(--surface);border:2px solid var(--line-strong);border-radius:20px}
.first h2{font-size:34px;font-weight:760;line-height:1.12}
.first p{font-size:21px;color:var(--ink-2);margin-top:12px;max-width:34em}
.first .acts{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.first .go{width:auto;padding:0 24px}
.ghost{height:var(--target);padding:0 22px;border-radius:16px;border:2px solid var(--ink);font-size:20px;font-weight:700;background:var(--surface)}
.ghost:active{background:var(--ink);color:var(--surface)}
.err{max-width:680px;margin:40px auto 0;padding:32px;background:var(--urg-tint);border:2px solid var(--urg-ink);border-radius:20px;display:flex;gap:20px;align-items:flex-start}
.err > .i{width:44px;height:44px;color:var(--urg-ink);flex:none}
.err h2{font-size:30px;font-weight:760;line-height:1.1}
.err p{font-size:20px;margin-top:8px}
.err .go{width:auto;margin-top:22px;padding:0 24px}
.skel{height:92px;border-radius:16px;background:linear-gradient(90deg,var(--inset),var(--surface),var(--inset));background-size:200% 100%;border:2px solid var(--line);animation:sh 1.4s linear infinite}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- Bon de commande ---------- */
.cmd{background:var(--surface);border-left:2px solid var(--line-strong);display:flex;flex-direction:column;min-height:100vh;min-height:100dvh}
.cmd header{display:flex;align-items:center;gap:12px;padding:14px 20px 12px;border-bottom:2px dashed var(--line-strong)}
.cmd h2{font-size:28px;font-weight:760;line-height:1.1;margin-right:auto}
.cmd .cnt{min-width:36px;height:36px;padding:0 10px;border-radius:18px;background:var(--act);color:var(--act-ink);font-size:20px;font-weight:760;display:inline-flex;align-items:center;justify-content:center}
.cmd .close{display:none;width:var(--target);height:var(--target);border-radius:16px;border:2px solid var(--ink);align-items:center;justify-content:center}
.cmd .body{flex:1;padding:6px 20px 12px;overflow:auto}
.cmd li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:2px dashed var(--line)}
.cmd li .t{flex:1;min-width:0}
.cmd li b{display:block;font-size:22px;font-weight:700;line-height:1.15}
.cmd li span.q{display:block;font-size:20px;color:var(--ink-2);font-weight:650;margin-top:2px}
.cmd li .rm{width:var(--target);height:var(--target);border-radius:16px;border:2px solid var(--line-strong);display:flex;align-items:center;justify-content:center;flex:none}
.cmd li .rm:active{background:var(--ink);color:var(--surface)}
.cmd .vide{padding:22px 0;color:var(--ink-2);font-size:20px}
.cmd footer{padding:14px 20px 20px;border-top:2px dashed var(--line-strong);position:sticky;bottom:0;background:var(--surface)}
.cmd footer p{font-size:17px;color:var(--ink-2);margin-bottom:10px}
.cmd footer .go:disabled{background:var(--inset);color:var(--ink-2);border:2px dashed var(--line-strong)}
@media (min-width:1240px){.cmd{position:sticky;top:0;height:100vh;height:100dvh;min-height:0}}
@media (max-width:1239px){
  .cmd{position:fixed;z-index:20;top:0;right:0;bottom:0;width:min(420px,94vw);min-height:0;transform:translateX(105%);visibility:hidden;box-shadow:-8px 0 0 rgba(18,32,40,.18);transition:transform .2s ease-out,visibility 0s linear .2s}
  .cmd.open{transform:none;visibility:visible;transition:transform .2s ease-out}
  .cmd .close{display:flex}
  .scrim{position:fixed;inset:0;z-index:15;background:rgba(18,32,40,.45);display:none}
  .scrim.on{display:block}
}

/* ---------- Annuler : dans la barre, jamais sur la liste ---------- */
.toast{position:absolute;z-index:3;left:0;right:0;top:0;height:80px;
  display:none;align-items:center;gap:14px;background:var(--ink);color:var(--surface);padding:0 var(--pad)}
@media (min-width:960px){.toast{height:auto;bottom:2px}}
.toast.on{display:flex}
.toast p{font-size:21px;font-weight:600;line-height:1.2;flex:1;min-width:0}
.toast button{height:56px;padding:0 24px;border-radius:14px;background:var(--surface);color:var(--ink);font-size:21px;font-weight:760;flex:none}
.toast button:active{background:var(--line)}
.toast button[hidden]{display:none}
.toast :focus-visible{outline-color:var(--surface)}

/* ---------- Pavé numérique ---------- */
dialog.pad{border:0;padding:0;border-radius:24px;background:var(--surface);color:var(--ink);width:min(420px,94vw);box-shadow:0 0 0 3px var(--ink)}
dialog.pad::backdrop{background:rgba(18,32,40,.55)}
.pad .hd{padding:18px 22px 10px}
.pad .hd p{font-size:20px;color:var(--ink-2);font-weight:600}
.pad .hd h2{font-size:28px;font-weight:760;line-height:1.1;margin-top:2px}
.pad .disp{margin:8px 22px 14px;height:84px;border-radius:16px;background:var(--inset);border:2px solid var(--line-strong);display:flex;align-items:baseline;justify-content:flex-end;gap:10px;padding:0 18px;font-size:52px;font-weight:760;line-height:80px}
.pad .disp span{font-size:24px;color:var(--ink-2);font-weight:650}
.pad .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:0 22px}
.pad .keys button{height:72px;border-radius:16px;border:2px solid var(--ink);background:var(--surface);font-size:32px;font-weight:700;display:flex;align-items:center;justify-content:center}
.pad .keys button:active{background:var(--ink);color:var(--surface)}
.pad .keys .i{width:34px;height:34px}
.pad .ft{display:grid;grid-template-columns:1fr 1.4fr;gap:10px;padding:14px 22px 22px}
.pad .ft button{height:var(--target)}
.pad .hint{padding:0 22px;font-size:17px;color:var(--ink-2);min-height:24px;margin-bottom:-4px}

@media (prefers-reduced-motion:reduce){
  .skel{animation:none}
  .cmd,.cmd.open{transition:none}
}
@media print{.toast,.scrim{display:none}}
</style>

<div class="app" id="app">
  <div class="main">

      <div class="id">
        <h1>Stock cuisine</h1>

      </button>

 {id:'echal',name:'Échalotes',zone:'reserve',cat:'Légumes',qty:0,unit:'kg',step:0.5,seuil:2,cible:6,dlc:null,t:'DLC'},
 {id:'pdt',name:'Pommes de terre',zone:'reserve',cat:'Légumes',qty:15,unit:'kg',step:5,seuil:20,cible:60,dlc:null,t:'DLC'},
 {id:'oignon',name:'Oignons jaunes',zone:'reserve',cat:'Légumes',qty:9,unit:'kg',step:1,seuil:5,cible:15,dlc:null,t:'DLC'},
 {id:'farine',name:'Farine T55',zone:'reserve',cat:'Épicerie',qty:18,unit:'kg',step:5,seuil:10,cible:50,dlc:150,t:'DDM'},
 {id:'riz',name:'Riz basmati',zone:'reserve',cat:'Épicerie',qty:6,unit:'kg',step:1,seuil:5,cible:25,dlc:300,t:'DDM'},
 {id:'huileo',name:'Huile d’olive',zone:'reserve',cat:'Huiles',qty:7,unit:'l',step:1,seuil:5,cible:15,dlc:240,t:'DDM'},
 {id:'huilef',name:'Huile de friture',zone:'reserve',cat:'Huiles',qty:12,unit:'l',step:5,seuil:10,cible:40,dlc:200,t:'DDM'},
 {id:'tomates',name:'Tomates pelées (boîte 5/1)',zone:'reserve',cat:'Conserves',qty:8,unit:'boîtes',step:1,seuil:6,cible:18,dlc:400,t:'DDM'},
 {id:'sucre',name:'Sucre',zone:'reserve',cat:'Épicerie',qty:8,unit:'kg',step:1,seuil:4,cible:20,dlc:500,t:'DDM'},
 {id:'cafe',name:'Café en grains',zone:'reserve',cat:'Épicerie',qty:3,unit:'kg',step:0.5,seuil:2,cible:6,dlc:120,t:'DDM'}
]}

var S={items:[],zone:'tout',order:[],flagged:{},cmd:[],scenario:'rempli',offline:false,pending:0,undo:null,timer:null,tt:null,pad:null};

/* ---------- Règles d’état ---------- */
function signals(it){
  var out=[];
  if(it.qty<=0){out.push({k:'out',tier:2,rank:4,ic:'out',cls:'urg',tx:'Rupture'});return out}
  if(it.dlc!==null){
    if(it.t==='DLC'){
      if(it.dlc<0){out.push({k:'exp',tier:2,rank:5,ic:'x',cls:'solid',tx:it.dlc===-1?'Périmé depuis hier':'Périmé depuis '+(-it.dlc)+NB+'jours'})}
      else if(it.dlc===0){out.push({k:'d0',tier:2,rank:3,ic:'clock',cls:'urg',tx:'DLC aujourd’hui'})}
      else if(it.dlc===1){out.push({k:'d1',tier:1,rank:1,ic:'clock',cls:'att',tx:'DLC demain'})}
    }else if(it.dlc<0){out.push({k:'ddm',tier:1,rank:1,ic:'clock',cls:'att',tx:'DDM dépassée'})}
  }
  if(it.qty<=it.seuil){out.push({k:'low',tier:1,rank:2,ic:'low',cls:'att',tx:'Seuil atteint ('+fmt(it.seuil)+NB+it.unit+')'})}
  return out;
}
function tierOf(it){var s=signals(it),t=0,r=0;s.forEach(function(x){t=Math.max(t,x.tier);r=Math.max(r,x.rank)});return {t:t,r:r,s:s}}
function zoneItems(z){return S.items.filter(function(i){return z==='tout'||i.zone===z})}
function sortIds(){
  var arr=S.items.map(function(i){var t=tierOf(i);return {i:i,t:t.t,r:t.r}});
  arr.sort(function(a,b){return b.t-a.t||b.r-a.r||(a.i.zone===b.i.zone?0:(a.i.zone==='froid'?-1:1))||a.i.name.localeCompare(b.i.name,'fr')});
  S.order=arr.map(function(x){return x.i.id});
  S.flagged={};arr.forEach(function(x){if(x.t>0)S.flagged[x.i.id]=1});
}
function byId(id){for(var k=0;k<S.items.length;k++)if(S.items[k].id===id)return S.items[k]}
function alerts(z){return zoneItems(z).filter(function(i){return tierOf(i).t>0}).length}
function orderQty(it){var q=Math.max(it.step,Math.ceil((it.cible-it.qty)/it.step-1e-9)*it.step);return rnd(q)}

/* ---------- Rendu ---------- */
function gaugeHtml(it){
  var p=Math.max(0,Math.min(1,it.qty/it.cible)),s=Math.max(0,Math.min(1,it.seuil/it.cible));
  return '<div class="gauge'+(it.qty<=it.seuil?' low':'')+'" aria-hidden="true"><i style="width:'+(p*100).toFixed(1)+'%"></i><b style="left:'+(s*100).toFixed(1)+'%"></b></div>';
}
function rowHtml(it){
  var T=tierOf(it),s=T.s,cls='row'+(T.t?' t'+T.t:'');
  var resolved=!T.t&&S.flagged[it.id];
  if(resolved)cls+=' done';
  var tags='';
  if(resolved){tags='<span class="tag done">'+ICON('check')+'Réglé</span>'}
  else if(s.length){tags=s.map(function(x){return '<span class="tag '+x.cls+'">'+ICON(x.ic)+x.tx+'</span>'}).join('')}
  else{
    var m=it.cat;
    if(it.dlc!==null)m+=' · '+it.t+NB+fmtDate(it.dlc);
    tags='<span class="meta">'+m+'</span>';
  }
  var zs=it.zone==='froid'?'Froid':'Réserve';
  var name='<p class="nm">'+it.name+'<span class="z"><span class="zf">'+ZN[it.zone]+'</span><span class="zs">'+zs+'</span></span></p>';
  var act='';
  if(it.qty>0&&it.dlc!==null&&it.t==='DLC'&&it.dlc<0)act='<button type="button" class="go" data-act="remove" data-id="'+it.id+'" aria-label="Jeter '+it.name+' (périmé)">'+ICON('trash')+'Jeter</button>';
  else if(T.t>0&&(it.qty<=it.seuil)){
    var on=S.cmd.indexOf(it.id)>-1;
    act='<button type="button" class="go" data-act="cmd" data-id="'+it.id+'" aria-pressed="'+on+'" aria-label="'+(on?'Dans la commande, toucher pour retirer : ':'Ajouter à la commande : ')+it.name+'">'+(on?ICON('check')+'Ajouté':ICON('plus')+'Commander')+'</button>';
  }
  var dis=it.qty<=0?' disabled':'';
  var step='<div class="step">'
   +'<button type="button" class="sb" data-act="dec" data-id="'+it.id+'"'+dis+' aria-label="Diminuer de '+fmt(it.step)+NB+it.unit+' : '+it.name+'">'+ICON('minus')+'<small>'+fmt(it.step)+'</small></button>'
   +'<button type="button" class="qv" data-act="pad" data-id="'+it.id+'" aria-label="Quantité de '+it.name+' : '+fmt(it.qty)+NB+it.unit+'. Saisir une valeur">'+fmt(it.qty)+'<span>'+it.unit+'</span></button>'
   +'<button type="button" class="sb" data-act="inc" data-id="'+it.id+'" aria-label="Augmenter de '+fmt(it.step)+NB+it.unit+' : '+it.name+'">'+ICON('plus')+'<small>'+fmt(it.step)+'</small></button>'
   +'</div>';
  return '<li class="'+cls+'" data-row="'+it.id+'"><div class="id">'+name+'<div class="sub">'+tags+'</div></div>'+step+'<div class="act">'+act+'</div>'+gaugeHtml(it)+'</li>';
}
function renderBar(){
  $('#when').textContent=TODAY.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  var z=[['tout','Tout'],['froid','Chambre froide'],['reserve','Réserve']];
  $('#zones').innerHTML=z.map(function(x){
    var n=S.scenario==='premier'?0:alerts(x[0]);
    return '<button type="button" data-zone="'+x[0]+'" aria-pressed="'+(S.zone===x[0])+'">'+x[1]+'<span class="n'+(n?'':' zero')+'" aria-label="'+n+' à traiter">'+n+'</span></button>';
  }).join('');
  var b=$('#banner');
  if(S.offline){
    b.innerHTML='<div class="banner">'+ICON('wifi')+'<p>Pas de réseau. Vos changements restent sur la tablette et partiront au retour du réseau.'+(S.pending?' <b>'+S.pending+(S.pending>1?' changements en attente.':' changement en attente.')+'</b>':'')+'</p></div>';
  }else b.innerHTML='';
  var n=S.cmd.length;$('#cmd-n').textContent=n;
}
function statusHtml(){
  var hm=NOW.getHours()+NB+'h'+NB+('0'+NOW.getMinutes()).slice(-2);
  var sy=S.offline?'<span class="sync warn">'+ICON('wifi')+'Hors connexion</span>':'<span class="sync">'+ICON('check')+'À jour'+NB+'·'+NB+hm+'</span>';
  return '<div class="st">'+sy+'<span class="chip">Données d’exemple</span></div>';
}
function renderView(){
  var v=$('#view');v.setAttribute('data-zone',S.zone);v.setAttribute('aria-busy',S.scenario==='chargement');
  if(S.scenario==='chargement'){v.innerHTML='<div class="sec"><h2>Chargement du stock…</h2></div><div class="rows">'+'<div class="skel"></div>'.repeat(6)+'</div>';return}
  if(S.scenario==='erreur'){v.innerHTML='<div class="err">'+ICON('warn')+'<div><h2>Le stock ne s’est pas chargé.</h2><p>Les quantités ne sont pas à jour. Vérifiez le réseau de la cuisine, puis réessayez.</p><button type="button" class="go" data-act="retry">'+ICON('refresh')+'Réessayer</button></div></div>';return}
  if(S.scenario==='premier'){
    v.innerHTML='<div class="first"><h2>Aucun produit suivi pour l’instant.</h2><p>Ajoutez les produits de la chambre froide et de la réserve, avec leur seuil d’alerte. Les plus urgents remonteront ici, en haut.</p><div class="acts"><button type="button" class="go" data-act="add">'+ICON('plus')+'Ajouter un produit</button><button type="button" class="ghost" data-act="demo">Voir un exemple rempli</button></div></div>';
    return;
  }
  var list=S.order.map(byId).filter(function(i){return S.zone==='tout'||i.zone===S.zone});
  var fl=list.filter(function(i){return S.flagged[i.id]}),rest=list.filter(function(i){return !S.flagged[i.id]});
  var nowFl=list.filter(function(i){return tierOf(i).t>0}).length;
  var h='',DEMO=statusHtml();
  if(fl.length){
    h+='<div class="sec"><h2>À traiter</h2><span class="cnt">'+nowFl+'</span>'+DEMO+'</div><ul class="rows" aria-label="Produits à traiter">'+fl.map(rowHtml).join('')+'</ul>';
  }else{
    h+='<div class="calm">'+ICON('okc')+'<div><h2>Rien à traiter.</h2><p>Aucun produit sous son seuil, aucune date à surveiller'+(S.zone==='tout'?'':' dans cette zone')+'.</p></div>'+DEMO+'</div>';
  }
  if(rest.length){
    h+='<div class="sec rest"><h2>'+(fl.length?'Le reste du stock':'Tout le stock')+'</h2><span class="cnt">'+rest.length+'</span></div><ul class="rows" aria-label="Autres produits">'+rest.map(rowHtml).join('')+'</ul>';
  }
  v.innerHTML=h;
}
function renderRail(){
  var ids=S.cmd.filter(function(id){return byId(id)});
  $('#rail-n').textContent=ids.length;$('#rail-n').style.display=ids.length?'':'none';$('#cmd-n').textContent=ids.length;
  var b=$('#rail-body');
  if(!ids.length){b.innerHTML='<p class="vide">Rien dans la commande. Touchez «'+NB+'Commander'+NB+'» sur un produit sous son seuil.</p>'}
  else b.innerHTML='<ul>'+ids.map(function(id){var it=byId(id);return '<li><div class="t"><b>'+it.name+'</b><span class="q">'+fmt(orderQty(it))+NB+it.unit+'</span></div><button type="button" class="rm" data-act="uncmd" data-id="'+id+'" aria-label="Retirer de la commande : '+it.name+'">'+ICON('close')+'</button></li>'}).join('')+'</ul>';
  $('#copy').disabled=!ids.length;
}
function renderAll(keepFocus){
  var f=document.activeElement,sel=null;
  if(keepFocus&&f&&f.dataset&&f.dataset.id&&f.dataset.act)sel='[data-id="'+f.dataset.id+'"][data-act="'+f.dataset.act+'"]';
  var y=window.scrollY;
  $('#app').classList.toggle('bare',S.scenario==='premier'||S.scenario==='erreur');
  renderBar();renderView();renderRail();
  if(keepFocus){window.scrollTo(0,y);if(sel){var n=$('#view '+sel)||$('#rail-body '+sel);if(n&&!n.disabled)n.focus({preventScroll:true})}}
}

/* ---------- Actions ---------- */
function say(t){var l=$('#live');l.textContent='';setTimeout(function(){l.textContent=t},30)}
function toast(msg,undo){
  var t=$('#toast');$('#toast-t').textContent=msg;
  var b=$('#toast-undo');b.hidden=!undo;S.undo=undo||null;
  t.classList.add('on');clearTimeout(S.tt);S.tt=setTimeout(hideToast,undo?10000:4500);
}
function hideToast(){$('#toast').classList.remove('on');S.undo=null}
function settle(){clearTimeout(S.timer);S.timer=setTimeout(function(){sortIds();renderAll(true)},3000)}
function changed(){if(S.offline)S.pending++}
function setQty(id,q,label){
  var it=byId(id);if(!it)return;
  var prev=(S.undo&&S.undo.id===id&&S.undo.kind==='qty')?S.undo.prev:{qty:it.qty,dlc:it.dlc};
  var before=prev.qty;
  it.qty=Math.max(0,rnd(q));
  if(it.qty===0)it.dlc=null;
  changed();
  renderAll(true);settle();
  var msg=label||(it.name+' : '+fmt(before)+' → '+fmt(it.qty)+NB+it.unit);
  toast(msg,{kind:'qty',id:id,prev:prev});
  say(msg);
}
function undo(){
  var u=S.undo;if(!u)return;
  var it=byId(u.id);
  if(u.kind==='qty'&&it){it.qty=u.prev.qty;it.dlc=u.prev.dlc;if(S.offline&&S.pending>0)S.pending--}
  hideToast();sortIds();renderAll(true);
  $('#live').textContent='Modification annulée';
}
function openPad(id){
  var it=byId(id);if(!it)return;
  S.pad={id:id,v:fmt(it.qty).replace(/\s/g,''),fresh:true};
  $('#pad-t').textContent=it.name;
  drawPad();
  var d=$('#pad');if(d.showModal)d.showModal();else d.setAttribute('open','');
}
function drawPad(){
  var it=byId(S.pad.id);
  $('#pad-disp').innerHTML=(S.pad.v===''?'0':S.pad.v)+'<span>'+it.unit+'</span>';
  var n=parseFloat(S.pad.v.replace(',','.'));
  var bad=isNaN(n)&&S.pad.v!=='';
  $('#pad-hint').textContent=n>9999?'Valeur trop grande.':'';
  $('#pad-ok').disabled=n>9999;
}
function padKey(k){
  var p=S.pad;if(!p)return;
  if(k==='back'){p.v=p.fresh?'':p.v.slice(0,-1);p.fresh=false}
  else if(k===','){if(p.fresh){p.v='0,';p.fresh=false}else if(p.v.indexOf(',')<0){p.v=(p.v===''?'0':p.v)+','}}
  else{
    if(p.fresh){p.v=k;p.fresh=false}else if(p.v==='0'){p.v=k}
    else{var d=p.v.split(',')[1];if(!(d!==undefined&&d.length>=2)&&p.v.replace(',','').length<6)p.v+=k}
  }
  drawPad();
}
function closePad(){var d=$('#pad');if(d.close)d.close();else d.removeAttribute('open');S.pad=null}
function copyList(){
  var ids=S.cmd.filter(byId);if(!ids.length)return;
  var d=TODAY.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
  var txt='Commande du '+d+'\n'+ids.map(function(id){var it=byId(id);return '- '+it.name+' : '+fmt(orderQty(it))+' '+it.unit}).join('\n');
  function ok(){toast('Liste copiée ('+ids.length+(ids.length>1?' produits':' produit')+').',null)}
  function ko(){toast('La copie n’a pas fonctionné sur cet appareil. La liste reste affichée dans la commande.',null)}
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,function(){fallback()})}else fallback();
  }catch(e){fallback()}
  function fallback(){
    try{var ta=document.createElement('textarea');ta.value=txt;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0;top:0';document.body.appendChild(ta);ta.select();var r=document.execCommand('copy');document.body.removeChild(ta);r?ok():ko()}catch(e){ko()}
  }
}
function openCmd(open){
  var a=$('#commande');a.classList.toggle('open',open);$('#scrim').classList.toggle('on',open);
  $('#open-cmd').setAttribute('aria-expanded',open);
  if(open){$('#close-cmd').focus()}else{if(window.matchMedia('(max-width:1239px)').matches)$('#open-cmd').focus()}
}

/* ---------- Événements ---------- */
document.addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;
  var act=b.dataset.act,id=b.dataset.id;
  if(b.dataset.zone){S.zone=b.dataset.zone;sortIds();renderAll(false);return}
  if(act==='inc'){var it=byId(id);setQty(id,it.qty+it.step)}
  else if(act==='dec'){var it2=byId(id);if(it2.qty>0)setQty(id,it2.qty-it2.step)}
  else if(act==='pad'){openPad(id)}
  else if(act==='remove'){var it3=byId(id);var q=it3.qty;setQty(id,0,it3.name+' jeté ('+fmt(q)+NB+it3.unit+').')}
  else if(act==='cmd'){var i=S.cmd.indexOf(id);if(i>-1)S.cmd.splice(i,1);else S.cmd.push(id);changed();renderAll(true);say(byId(id).name+(i>-1?' retiré de la commande':' ajouté à la commande'))}
  else if(act==='uncmd'){var j=S.cmd.indexOf(id);if(j>-1)S.cmd.splice(j,1);renderAll(false);say('Retiré de la commande')}
  else if(act==='retry'){S.scenario='chargement';renderAll(false);setTimeout(function(){S.scenario='rempli';S.items=base();sortIds();renderAll(false)},900)}
  else if(act==='add'){toast('L’écran d’ajout de produit n’est pas encore conçu dans cette proposition.',null)}
  else if(act==='demo'){load('rempli')}
  else if(b.id==='toast-undo'){undo()}
  else if(b.id==='open-cmd'){openCmd(true)}
  else if(b.id==='close-cmd'){openCmd(false)}
  else if(b.id==='copy'){copyList()}
  else if(b.id==='pad-cancel'){closePad()}
  else if(b.id==='pad-ok'){
    var p=S.pad;if(p){var n=parseFloat((p.v||'0').replace(',','.'));if(!isNaN(n)&&n<=9999){var iid=p.id;closePad();setQty(iid,n)}}
  }
  else if(b.dataset.key){padKey(b.dataset.key)}
});
$('#scrim').addEventListener('click',function(){openCmd(false)});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('#commande').classList.contains('open'))openCmd(false)});
$('#pad').addEventListener('close',function(){S.pad=null});
$('#pad-keys').innerHTML=['1','2','3','4','5','6','7','8','9',',','0','back'].map(function(k){
  return k==='back'?'<button type="button" data-key="back" aria-label="Effacer le dernier chiffre">'+ICON('back')+'</button>':'<button type="button" data-key="'+k+'">'+(k===','?',':k)+'</button>';
}).join('');

/* ---------- Scénarios (adresse #vide, #chargement…) ---------- */
function load(sc){
  S.scenario=(sc==='hors-ligne'||sc==='commande'||sc==='numpad')?'rempli':sc;S.offline=false;S.pending=0;S.cmd=[];S.zone='tout';hideToast();
  var items=base();
  if(sc==='vide'){items.forEach(function(i){i.qty=Math.max(i.qty,rnd(i.seuil+i.step*2));if(i.t==='DLC'&&i.dlc!==null&&i.dlc<=1)i.dlc=5;if(i.qty<=i.seuil)i.qty=rnd(i.seuil+i.step)});items.forEach(function(i){if(i.id==='echal')i.dlc=null})}
  if(sc==='premier')items=[];
  if(sc==='hors-ligne')S.offline=true;
  S.items=items;sortIds();
  if(sc==='commande'){S.cmd=['bar','creme','echal'];}
  renderAll(false);
  if(sc==='commande')openCmd(true);
  if(sc==='numpad')openPad('bar');
}
function fromHash(){
  var h=(location.hash||'').replace('#','');
  var known={vide:1,chargement:1,'premier-lancement':1,'hors-ligne':1,erreur:1,commande:1,numpad:1};
  if(!known[h])return load('rempli');
  if(h==='premier-lancement')return load('premier');
  if(h==='erreur'){S.scenario='erreur';S.items=[];S.order=[];S.flagged={};renderAll(false);return}
  if(h==='chargement'){S.scenario='chargement';S.items=[];renderAll(false);return}
  load(h);
}
window.addEventListener('hashchange',fromHash);
fromHash();
})();
</script>
</body>
</html>
