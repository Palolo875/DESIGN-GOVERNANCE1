name: Validate Design Governance

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # épinglé par SHA complet ; v7.0.1, runtime node24 (vérifié le 2026-09-26)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Python
        # épinglé par SHA complet ; v7.0.0, runtime node24 (vérifié le 2026-09-26)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
      - name: Install browser for render tests
        # version épinglée ; Chromium et ses dépendances système pour les tests de pages de check_render
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps chromium
      - name: Run package audit
        run: python3 scripts/validate_all.py --require-browser

